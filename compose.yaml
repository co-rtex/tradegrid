# Local development services. See backend/db/README.md.
#
# The in-memory exchange does not use PostgreSQL in Sprint 2; this database is
# for schema, migration, and seed work only.
name: tradegrid

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tradegrid}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tradegrid-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-tradegrid}
    ports:
      # Bound to localhost only so the development database is not exposed
      # to the network.
      - "127.0.0.1:${TRADEGRID_DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres-data:
